id: gomodel:6ac817cf00001061
title: 'Visual perception: Glutamate acts on OFF cone bipolar cells via kainate glutamate
  receptor complex (Human).'
taxon: NCBITaxon:9606
status: production
date_modified: '2026-10-16'
comments:
- 'Comment to reviewer: Output of signaling via glutamate depends on light and dark
  condition. In the light: less glutamate release by the photoreceptor -> less glutamate
  in the synaptic cleft means less activation of kainate receptor complex on the OFF
  cells -> membrane hyperpolarization of OFF cells -> OFF cells are inhibited.

  In the dark: continuos glutamate release by the photoreceptor -> more glutamate
  in the synaptic cleft means activation of kainate receptor complex on the OFF cells
  -> membrane depolarization of OFF cells -> OFF cells are activated.


  Most of the signals on the OFF bipolar cells are transmitted by kainate receptors
  with only a limited contributions of AMPA receptors'
